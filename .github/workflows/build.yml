name: 构建校验

# 在 PR 和 push 时运行常规构建与测试，确保代码可编译且测试通过
on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: 设置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 构建与测试
        run: ./gradlew build