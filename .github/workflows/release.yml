name: 自动发布

# 推送 v* 标签时触发（如 v1.0.3+1.21.8），自动构建并发布到 Modrinth 与 CurseForge
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # CurseForgeGradle 1.3.33 要求 JVM 25；编译目标仍为 Java 21（build.gradle 中 options.release = 21）
          java-version: 25

      - name: 设置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 提取版本号与更新日志
        run: |
          # 去掉标签前缀 v，得到完整版本号（如 1.0.3+1.21.8）
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # 去掉 + 及之后的游戏版本部分，得到 mod 版本（如 1.0.3）
          MOD_VERSION="${VERSION%%+*}"
          echo "MOD_VERSION=$MOD_VERSION" >> "$GITHUB_ENV"
          # 从 CHANGELOG.md 提取对应版本段落（## 1.0.3+1.21.8 到下一个 ## 之间）
          CHANGELOG=$(awk -v ver="$VERSION" '
            $0 ~ "^## " {
              if (found) exit
              if ($0 == "## " ver) found = 1
              next
            }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$CHANGELOG" ]; then CHANGELOG="更新内容见 CHANGELOG.md"; fi
          {
            echo "CHANGELOG_CONTENT<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: 构建与测试
        # -Pmod_version 以标签中的 mod 版本覆盖 gradle.properties，保证产物版本与标签一致
        run: ./gradlew build -Pmod_version="${{ env.MOD_VERSION }}"

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ env.VERSION }}
          body: ${{ env.CHANGELOG_CONTENT }}
          files: build/libs/chatblocker-${{ env.VERSION }}.jar

      - name: 发布到 Modrinth
        run: ./gradlew modrinth -Pmod_version="${{ env.MOD_VERSION }}"
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}

      - name: 发布到 CurseForge
        run: ./gradlew publishCurseForge -Pmod_version="${{ env.MOD_VERSION }}"
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
