# 提高 Gradle 可用内存
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA 与配置缓存尚未完全兼容
org.gradle.configuration-cache=false

# Fabric 属性
# 版本请以 https://fabricmc.net/develop 为准
minecraft_version=1.21.8
loader_version=0.19.3
loom_version=1.17-SNAPSHOT

# Mod 属性
# mod 版本号（最终版本号 = mod 版本 + 游戏版本，如 1.0.3+1.21.8）
mod_version=1.0.3
group=net.chatblocker

# 依赖版本
fabric_api_version=0.136.1+1.21.8
modmenu_version=15.0.2
yacl_version=3.8.2+1.21.6-fabric

# 自动发布
# Minotaur（Modrinth 上传）与 CurseForgeGradle（CurseForge 上传）插件版本
minotaur_version=2.9.0
curseforgegradle_version=1.3.33
# Modrinth 项目 slug：https://modrinth.com/mod/chatblocker_
modrinth_project_id=chatblocker_
# CurseForge 项目数字 ID：https://www.curseforge.com/minecraft/mc-mods/1666145
curseforge_project_id=1666145
# 发布时标记的游戏版本（fabric.mod.json 约束 ~1.21.8，实测 1.21.11 可运行）
publish_game_versions=1.21.8,1.21.9,1.21.10,1.21.11
