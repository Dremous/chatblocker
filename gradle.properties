# 提高 Gradle 可用内存
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA 与配置缓存尚未完全兼容
org.gradle.configuration-cache=false

# Fabric 属性
# 版本请以 https://fabricmc.net/develop 为准
minecraft_version=26.3
loader_version=0.20.1
loom_version=1.19.3

# Mod 属性
# mod 版本号（最终版本号 = mod 版本 + 游戏版本，如 1.1.1+26.3）
mod_version=1.1.1
group=net.chatblocker

# 依赖版本
fabric_api_version=0.165.0+26.3
modmenu_version=21.0.0
yacl_version=3.9.7+26.3-fabric

# 自动发布
# Minotaur（Modrinth 上传）与 CurseForgeGradle（CurseForge 上传）插件版本
minotaur_version=2.9.0
curseforgegradle_version=1.3.33
# Modrinth 项目 slug：https://modrinth.com/mod/chatblocker_
modrinth_project_id=chatblocker_
# CurseForge 项目数字 ID：https://www.curseforge.com/minecraft/mc-mods/1666145
curseforge_project_id=1666145
# 发布时标记的游戏版本（逗号分隔多版本；留空则回退为 minecraft_version）
# 需与 fabric.mod.json 的 minecraft 约束保持一致
publish_game_versions=26.3
