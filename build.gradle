plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
	id 'com.modrinth.minotaur' version "${minotaur_version}"
	id 'net.darkhax.curseforgegradle' version "${curseforgegradle_version}"
}

// 最终版本号 = mod 版本 + 游戏版本（如 1.0.3+26.2），mod 版本部分定义在 gradle.properties 的 mod_version
version = "${project.mod_version}+${project.minecraft_version}"

repositories {
	// ModMenu 仓库
	maven {
		name = 'Terraformers'
		url = 'https://maven.terraformersmc.com/releases/'
	}
	// YACL 仓库
	maven {
		name = 'Xander Maven'
		url = 'https://maven.isxander.dev/releases'
	}
}

loom {
	// 客户端代码与公共代码分离（src/client 与 src/main）
	splitEnvironmentSourceSets()

	mods {
		"chatblocker" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// 版本见 gradle.properties
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API：提供聊天事件与客户端命令 API
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// ModMenu：Mod 列表中的配置入口
	implementation "com.terraformersmc:modmenu:${project.modmenu_version}"

	// YACL：配置界面库
	implementation "dev.isxander:yet-another-config-lib:${project.yacl_version}"

	// 单元测试
	testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.11.4"
	// 测试源集不继承 Minecraft 的 Gson，显式声明
	testImplementation "com.google.code.gson:gson:2.11.0"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

test {
	useJUnitPlatform()
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// 配置 Maven 发布
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
		// 发布用仓库留空，本项目仅本地构建
	}
}

// Modrinth 自动发布（Minotaur 插件，任务 modrinth）
modrinth {
	// Token 取自环境变量 MODRINTH_TOKEN（CI 中由 GitHub Secrets 注入）
	token = System.getenv("MODRINTH_TOKEN")
	projectId = project.modrinth_project_id
	versionNumber = project.version
	versionType = "release"
	uploadFile = jar
	gameVersions = project.publish_game_versions.split(",").toList()
	loaders = ["fabric"]
	// 更新日志由 CI 从 CHANGELOG.md 提取并注入环境变量
	changelog = System.getenv("CHANGELOG_CONTENT") ?: "更新内容见 CHANGELOG.md"
	// 版本已存在时不中断构建（重跑发布时 CurseForge 仍可继续上传）
	failSilently = true
	// 项目描述从 MODRINTH_DESCRIPTION.md 同步（modrinthSyncBody 任务）。
	// 该文件被 .gitignore 排除、仅存于本机，CI 中不存在时跳过配置
	def descriptionFile = rootProject.file("MODRINTH_DESCRIPTION.md")
	if (descriptionFile.exists()) {
		syncBodyFrom = descriptionFile.text
	}
	dependencies {
		required.project "fabric-api"
		required.project "yacl"
		optional.project "modmenu"
	}
}

// CurseForge 自动发布（CurseForgeGradle 插件，任务 publishCurseForge）
task publishCurseForge(type: net.darkhax.curseforgegradle.TaskPublishCurseForge) {
	// Token 取自环境变量 CURSEFORGE_TOKEN（CI 中由 GitHub Secrets 注入）
	apiToken = System.getenv("CURSEFORGE_TOKEN")
	group = "publishing"

	def mainFile = upload(project.curseforge_project_id, jar)
	mainFile.releaseType = "release"
	mainFile.changelog = System.getenv("CHANGELOG_CONTENT") ?: "更新内容见 CHANGELOG.md"
	mainFile.changelogType = "markdown"
	mainFile.displayName = "ChatBlocker ${project.version}"
	// 纯客户端 Mod，仅标记 Client 环境（CurseForge 2026-07 起强制要求环境标签）
	mainFile.addEnvironment("Client")
	mainFile.addModLoader("Fabric")
	project.publish_game_versions.split(",").each { mainFile.addGameVersion(it) }
	mainFile.addRequirement("fabric-api", "yacl")
	mainFile.addOptional("modmenu")
}
