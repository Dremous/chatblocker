plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'com.modrinth.minotaur' version "${minotaur_version}"
	id 'net.darkhax.curseforgegradle' version "${curseforgegradle_version}"
}

// 最终版本号 = mod 版本 + 游戏版本（如 1.0.3+26.2），mod 版本部分定义在 gradle.properties 的 mod_version
version = "${project.mod_version}+${project.minecraft_version}"
base.archivesName = "chatblocker"

// 发布时标记的游戏版本（支持逗号分隔多版本，自动 trim 并忽略空项）。
// 属性留空时回退为当前 minecraft_version，避免新增版本时漏改导致发布到错误的游戏版本。
def publishGameVersions = project.publish_game_versions.split(",")
		.collect { it.trim() }
		.findAll { !it.isEmpty() }
if (publishGameVersions.isEmpty()) {
	publishGameVersions = [project.minecraft_version]
}

repositories {
	// 阿里云 Maven Central 镜像仅供本地国内网络加速；CI 环境只走官方源，
	// 与 settings.gradle 的 pluginManagement 保持一致，避免远端索引超时。
	if (!System.getenv('CI')) {
		maven {
			name = 'Aliyun Central'
			url = 'https://maven.aliyun.com/repository/central'
		}
	}
	mavenCentral()
	// ModMenu 仓库
	maven {
		name = 'Terraformers'
		url = 'https://maven.terraformersmc.com/releases/'
	}
	// YACL 仓库
	maven {
		name = 'Xander Maven'
		url = 'https://maven.isxander.dev/releases'
	}
}

loom {
	// 客户端代码与公共代码分离（src/client 与 src/main）
	splitEnvironmentSourceSets()

	mods {
		"chatblocker" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// 版本见 gradle.properties
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API：提供聊天事件与客户端命令 API
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// ModMenu：Mod 列表中的配置入口
	implementation "com.terraformersmc:modmenu:${project.modmenu_version}"

	// YACL：配置界面库
	implementation "dev.isxander:yet-another-config-lib:${project.yacl_version}"

	// 单元测试
	testImplementation "org.junit.jupiter:junit-jupiter:5.11.4"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.11.4"
	// 测试源集不继承 Minecraft 的 Gson，显式声明
	testImplementation "com.google.code.gson:gson:2.11.0"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

test {
	useJUnitPlatform()
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// ===== 发布任务（CI 自动发布到 Modrinth + CurseForge） =====
// Modrinth 自动发布（Minotaur 插件，任务 modrinth）
modrinth {
	// Token 取自环境变量 MODRINTH_TOKEN（CI 中由 GitHub Secrets 注入）
	token = System.getenv("MODRINTH_TOKEN")
	projectId = project.modrinth_project_id
	versionNumber = project.version
	versionType = "release"
	uploadFile = jar
	gameVersions = publishGameVersions
	loaders = ["fabric"]
	// 更新日志由 CI 从 CHANGELOG.md 提取并注入环境变量
	changelog = System.getenv("CHANGELOG_CONTENT") ?: "更新内容见 CHANGELOG.md"
	// 注意：不要开启 failSilently——它会把 401、非法版本号等真实错误一起吞掉，
	// 结果是 CI 全绿但 Modrinth 上没有该版本。版本重复时应让构建失败并人工判断。
	// 项目描述从 MODRINTH_DESCRIPTION.md 同步（modrinthSyncBody 任务）。
	// 该文件被 .gitignore 排除、仅存于本机，CI 中不存在时跳过配置
	def descriptionFile = rootProject.file("MODRINTH_DESCRIPTION.md")
	if (descriptionFile.exists()) {
		syncBodyFrom = descriptionFile.text
	}
	dependencies {
		required.project "fabric-api"
		required.project "yacl"
		optional.project "modmenu"
	}
}

// CurseForge 自动发布（CurseForgeGradle 插件，任务 publishCurseForge）
tasks.register("publishCurseForge", net.darkhax.curseforgegradle.TaskPublishCurseForge) {
	// Token 取自环境变量 CURSEFORGE_TOKEN（CI 中由 GitHub Secrets 注入）
	apiToken = System.getenv("CURSEFORGE_TOKEN")
	group = "publishing"

	def mainFile = upload(project.curseforge_project_id, jar)
	mainFile.releaseType = "release"
	mainFile.changelog = System.getenv("CHANGELOG_CONTENT") ?: "更新内容见 CHANGELOG.md"
	mainFile.changelogType = "markdown"
	mainFile.displayName = "ChatBlocker ${project.version}"
	// 纯客户端 Mod，仅标记 Client 环境（CurseForge 2026-07 起强制要求环境标签）
	mainFile.addEnvironment("Client")
	mainFile.addModLoader("Fabric")
	publishGameVersions.each { mainFile.addGameVersion(it) }
	mainFile.addRequirement("fabric-api", "yacl")
	mainFile.addOptional("modmenu")
}
